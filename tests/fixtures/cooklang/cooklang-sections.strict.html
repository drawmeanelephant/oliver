<div class="recipe">
<div class="ingredients">
<h2>Ingredients</h2>
<ul>
<li class="ingredient"><span class="quantity">200 g</span> flour</li>
<li class="ingredient"><span class="quantity">100 ml</span> water</li>
<li class="ingredient"><span class="quantity">100 g</span> cheese <span class="preparation">grated</span></li>
<li class="ingredient"><span class="quantity">50 g</span> spinach</li>
</ul>
</div>
<div>
<h2>Dough</h2>
<ol class="steps">
<li>Mix <span class="ingredient">flour</span> and <span class="ingredient">water</span> together until smooth.</li>
</ol>
</div>
<div>
<h2>Filling</h2>
<ol class="steps">
<li>Combine <span class="ingredient">cheese <span class="preparation">grated</span></span> and <span class="ingredient">spinach</span>, then season.</li>
</ol>
<div class="note">Serve the same day.</div>
</div>
</div>
