<p><span class="embed" data-embed-target="x">x</span>(u) is an embed plus literal parens.</p>
<p><a href="u">link ![[inside]]</a> demotes the embed.</p>
<p><img src="v" alt="desc ![[inside]]" /> flattens it in alt.</p>
<p><mark><span class="embed" data-embed-target="hl">hl</span></mark> nests inside a highlight.</p>
