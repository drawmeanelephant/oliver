name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: fmt + tests + conformance gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ziglang/setup-zig was deleted in the Zig org's GitHub->Codeberg
      # migration (Nov 2025); mlugg/setup-zig is its maintained successor
      # and a drop-in replacement supporting the same `version` input.
      #
      # GitHub emits a Node 20 deprecation warning for this action: v2.2.1
      # is the latest release and still declares a node20 runtime (GitHub
      # force-runs it on Node 24). Benign until mlugg publishes a node24
      # release; do not chase the warning by switching actions.
      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Format check
        run: zig fmt --check build.zig build.zig.zon src tests tools

      - name: Full test suite
        run: zig build test --summary all

      # The classified conformance gate binds Oliver to the exact official
      # CommonMark 0.31.2 corpus (byte count, example count, and SHA-256 are
      # verified first) and fails on any supported regression, unexpected
      # pass, or changed divergence. The corpus is fetched per
      # docs/TESTS.md; the harness refuses a different file.
      - name: Fetch official CommonMark 0.31.2 corpus
        run: curl -fsSL -o spec.txt https://spec.commonmark.org/0.31.2/spec.txt

      - name: Classified conformance gate (652/652)
        run: zig build spec-conformance -- spec.txt --gate

      # The Cooklang canonical wall runs the vendored corpus
      # (tests/cooklang/canonical.yaml, pinned commit, digest-bound) — no
      # network needed — and additionally asserts the serializer's
      # semantic fixed point over every corpus source.
      - name: Cooklang canonical conformance gate (60/60)
        run: zig build cooklang-conformance

      # The stable C ABI leg: compile examples/c_example.c with the
      # system C compiler against include/oliver.h and the static oliver
      # library, then run it. The example is self-checking (exits non-zero
      # on any failed assertion), proving the ABI compiles from C and
      # round-trips end to end (docs/C-ABI.md).
      - name: C ABI example (compile + run)
        run: zig build c-example-run
